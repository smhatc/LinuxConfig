#############
### INPUT ###
#############

# Adjusting general keyboard layout and mouse/touchpad settings

# Keyboard layout switching, general keyboard settings, and mouse/touchpad settings
input {
    kb_layout = us,ara
    kb_options = grp:win_space_toggle
    numlock_by_default = true
    repeat_delay = 300

    accel_profile = adaptive
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Touchpad gestures
gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

# Defining various keyboard shortcuts to speed up the overall workflow

# The main modifier key (SUPER = "Windows" key)
$mainMod = SUPER

# The name of the laptop lid switch device (found through "hyprctl devices")
$laptopLid = Lid Switch

# Lock and suspend when closing laptop lid (in place of systemd-logind)
bindl = , switch:on:$laptopLid, exec, loginctl lock-session && systemctl suspend

# Lock and suspend when pressing power button (prevents accidental shutdowns, in place of systemd-logind)
bindl = , XF86PowerOff, exec, loginctl lock-session && systemctl suspend

# Session, power, and notification controls
bind = CTRL ALT, DELETE, exec, $powerMenu
bind = $mainMod, N, exec, $notificationMenu $notificationMenuShowOpts
bind = $mainMod ALT, N, exec, $notificationMenu $notificationMenuDndOpts

# Screenshots
bind = , PRINT, exec, $screenshotApp $screenshotAppRegionOpts $screenshotAppSaveOpts # Region
bind = $mainMod, PRINT, exec, $screenshotApp $screenshotAppWindowOpts $screenshotAppSaveOpts # Window
bind = $mainMod SHIFT, PRINT, exec, $screenshotApp $screenshotAppMonitorOpts $screenshotAppSaveOpts # Monitor

# Night light
bindl = , F12, exec, pkill $nightLight && sleep 0.25 && pkill -RTMIN+1 $statusBar || $nightLight $nightLightOpts

# App launcher
bind = $mainMod, A, exec, $appLauncher

# Launching apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod ALT, T, exec, $secondaryTerminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod ALT, E, exec, $notepad
bind = $mainMod, F, exec, $firefox
bind = $mainMod ALT, F, exec, $firefoxPrivate
bind = $mainMod, B, exec, $brave
bind = $mainMod ALT, B, exec, $bravePrivate
bind = $mainMod, C, exec, $vscode
bind = $mainMod, V, exec, $virtManager
bind = $mainMod, L, exec, $localSend
bind = $mainMod ALT, L, exec, $bleachbit
bind = $mainMod, PERIOD, exec, $emojiPicker
bind = $mainMod, K, exec, $keePassXC
bind = $mainMod, Y, exec, $yubicoAuthenticator

# Launching scripts
bind = $mainMod ALT, K, exec, $backupScript
bind = $mainMod ALT, U, exec, $updateScript

# Switching window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Moving windows
bindm = $mainMod, mouse:272, movewindow
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Moving windows across workspaces
bind = $mainMod ALT SHIFT, left, movetoworkspace, r-1
bind = $mainMod ALT SHIFT, right, movetoworkspace, r+1
bind = $mainMod ALT SHIFT, 1, movetoworkspace, 1
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 2
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 3
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 4
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 5
bind = $mainMod ALT SHIFT, 6, movetoworkspace, 6
bind = $mainMod ALT SHIFT, 7, movetoworkspace, 7
bind = $mainMod ALT SHIFT, 8, movetoworkspace, 8
bind = $mainMod ALT SHIFT, 9, movetoworkspace, 9
bind = $mainMod ALT SHIFT, 0, movetoworkspace, 10
bind = $mainMod ALT SHIFT, BACKSPACE, movetoworkspace, special:SpecialWorkspace

# Resizing windows
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod SHIFT, F, togglefloating,

# Closing windows
bind = ALT, F4, killactive,

# Switching workspaces
bind = $mainMod, mouse_down, workspace, r-1
bind = $mainMod, mouse_up, workspace, r+1
bind = $mainMod ALT, left, workspace, r-1
bind = $mainMod ALT, right, workspace, r+1
bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, workspace, 10
bind = $mainMod ALT, BACKSPACE, togglespecialworkspace, SpecialWorkspace

# Brightness controls
bindel = , XF86MonBrightnessDown, exec, brightnessctl -n2 set 5%-
bindel = , F4, exec, brightnessctl -n2 set 5%-

bindel = , XF86MonBrightnessUp, exec, brightnessctl -n2 set 5%+
bindel = , F5, exec, brightnessctl -n2 set 5%+

# Volume output and input controls
bind = , F7, exec, $audioCtrl

bind = , XF86AudioMute, exec, $audioCtrlCli $audioCtrlCliMuteOutputOpts
bind = , F1, exec, $audioCtrlCli $audioCtrlCliMuteOutputOpts

binde = , XF86AudioLowerVolume, exec, $audioCtrlCli $audioCtrlCliLowerOutputOpts
binde = , F2, exec, $audioCtrlCli $audioCtrlCliLowerOutputOpts

binde = , XF86AudioRaiseVolume, exec, $audioCtrlCli $audioCtrlCliRaiseOutputOpts
binde = , F3, exec, $audioCtrlCli $audioCtrlCliRaiseOutputOpts

bind = , XF86AudioMicMute, exec, $audioCtrlCli $audioCtrlCliMuteInputOpts
bind = , F9, exec, $audioCtrlCli $audioCtrlCliMuteInputOpts

binde = , F8, exec, $audioCtrlCli $audioCtrlCliLowerInputOpts

binde = , F10, exec, $audioCtrlCli $audioCtrlCliRaiseInputOpts

# Audio track controls
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , F6, exec, playerctl play-pause

bind = , XF86AudioNext, exec, playerctl next
