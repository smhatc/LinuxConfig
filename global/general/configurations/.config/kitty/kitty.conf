# Theme import
include ~/.config/kitty/theme.conf

# Font options
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# Tab bar options
tab_bar_edge top

# Scrollback history length and scrollbar display options
scrollback_lines 10000
scrollbar always

# Cursor options
cursor_shape block
shell_integration enabled no-cursor
cursor_blink_interval -1
